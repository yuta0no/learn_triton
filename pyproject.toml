[project]
name = "learn-triton"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=1.22.0",
    "pandas>=2.3.3",
    "setuptools>=59.6.0",
    "torch>=1.5.1",
    "triton>=2.0.0",
]

[project.scripts]
learn-triton = "learn_triton:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
